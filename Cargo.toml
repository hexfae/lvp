[package]
name = "lvp"
version = "0.0.7"
edition = "2024"

[dependencies]
aws-config = { version = "1.8.8", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.109.0", features = ["behavior-version-latest"] }
ndarray = "0.16.1"
rand = "0.9.2"
snafu = "0.8.9"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
video-rs = { version = "0.10.5", features = ["ndarray"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
missing_docs_in_private_items = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
